# AurTextureGetMaxTexID @ 0x41FEB0 -- returns DAT_007A46BC (max texture ID).
# It has exactly one caller, ClearBuckets (0x46BEF0), which uses the value as
# an iteration count over three arrays that hold exactly 5000 entries each:
#
#   0x7FC00C .. 0x80AA6C   60000 bytes / 12 = 5000
#   0x80AA80 .. 0x8194E0   60000 bytes / 12 = 5000
#   0x8194E0 .. 0x827F40   60000 bytes / 12 = 5000
#
# Stock:
#   0x41FEB0  a1 bc 46 7a 00   mov eax,[0x7A46BC]
#   0x41FEB5  c3               ret
#   0x41FEB6  90 x10           inter-function padding
#
# We hook the ret (+4 padding bytes) and clamp on the way out. The replacement
# returns on both paths, so it never falls through to the automatic jump-back
# (which would land in padding).
#
#   cmp eax, 5000        3D 88 13 00 00
#   jb  +5               72 05             ; in range -> keep value, go to ret
#   mov eax, 4999        B8 87 13 00 00    ; saturate to the array bound
#   ret                  C3
#
# Saturating, not masking: an AND would wrap a legitimate max of e.g. 4500
# down to 404 and leave stale buckets uncleared.

[[hook]]
address = "0x0041FEB5"
type = "replace"
original_bytes = "C3 90 90 90 90"
replacement_bytes = "3D 88 13 00 00 72 05 B8 87 13 00 00 C3"
